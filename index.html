<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e4efe9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MeditateIt" />
    <meta
      name="description"
      content="MeditateIt — generative meditation soundscapes you shape in real time."
    />
    <!--
      Strict SPA CSP (also mirrored in public/_headers for static hosts).
      style-src keeps 'unsafe-inline' for React style={{…}} (progress widths,
      staggered list delays) — no style nonces for dynamic widths.
      worker-src 'self' covers AudioWorklet (/worklets/noise-processor.js).
      No blob:/wasm-unsafe-eval — worklet is a same-origin file URL.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'"
    />
    <title>MeditateIt</title>
    <!-- FOUC guard: external file keeps CSP script-src 'self'. -->
    <script src="%BASE_URL%theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
